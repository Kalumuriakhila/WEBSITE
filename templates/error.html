{% extends "base.html" %}
{% block title %}{{ error_code }} — Deepfake Detection{% endblock %}

{% block content %}
<div class="auth-wrapper" style="text-align: center; padding-top: 3rem;">
  <div class="card auth-card">
    <h1 style="font-size: 4rem; font-weight: 800; color: var(--accent-cyan); margin-bottom: 0.5rem;">
      {{ error_code }}
    </h1>
    <h2 style="margin-bottom: 0.6rem;">{{ error_title }}</h2>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">{{ error_message }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary btn-full">Go to Home</a>
  </div>
</div>
{% endblock %}
